<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>A Chave da Sala</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #101522;
      color: #f7f5ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 0%, #272344 0, transparent 48%),
        #101522;
    }

    main { width: min(100%, 1000px); }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #a99cf8;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); }

    .stats {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d7d4e5;
      font-size: .9rem;
      font-weight: 700;
    }

    .stat {
      padding: 9px 12px;
      border: 1px solid #34354c;
      border-radius: 12px;
      background: #1b2030;
      white-space: nowrap;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid #41405b;
      border-radius: 18px;
      background: #181c2a;
      box-shadow: 0 24px 70px #080a1280;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101522b8;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .message[hidden] { display: none; }

    .message-card {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #555174;
      border-radius: 20px;
      background: #1c2031;
      box-shadow: 0 16px 50px #080a1270;
    }

    .message-card p { color: #cbc9d9; line-height: 1.55; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      color: #19172a;
      background: #b7aaff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #c9c0ff; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .below {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 13px 4px 0;
      color: #b3b4c5;
      font-size: .88rem;
    }

    .controls { display: flex; gap: 8px; }
    .controls button { min-width: 48px; padding: 10px 14px; }
    .controls .jump { color: #f6f2ff; background: #5142a0; }
    .controls .jump:hover { background: #6554bd; }

    @media (max-width: 600px) {
      body { padding: 18px 10px; }
      .topbar { align-items: start; flex-direction: column; gap: 12px; }
      .below { align-items: start; flex-direction: column; }
      .controls { align-self: center; }
      .stat { padding: 7px 9px; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">Uma sala. Uma chave. Várias surpresas.</p>
        <h1>A Chave da Sala</h1>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat" id="levelLabel">Sala 1 / 6</div>
        <div class="stat" id="keyLabel">🔑 Chave: não</div>
        <div class="stat" id="livesLabel">♥ 3</div>
      </div>
    </header>

    <section class="game-frame" aria-label="Jogo A Chave da Sala">
      <canvas id="game" width="960" height="540" aria-label="Sala de jogo. Use as setas ou A e D para andar e espaço para pular."></canvas>
      <div class="message" id="message" hidden>
        <div class="message-card">
          <p class="eyebrow" id="messageEyebrow">Boa!</p>
          <h2 id="messageTitle">Você conseguiu!</h2>
          <p id="messageText"></p>
          <button id="messageButton" type="button">Continuar</button>
        </div>
      </div>
    </section>

    <footer class="below">
      <span>Andar: ← → ou A / D &nbsp;·&nbsp; Pular: Espaço / ↑ / W</span>
      <div class="controls" aria-label="Controles de toque">
        <button type="button" data-key="ArrowLeft" aria-label="Andar para a esquerda">←</button>
        <button type="button" data-key="ArrowRight" aria-label="Andar para a direita">→</button>
        <button class="jump" type="button" data-key="Space" aria-label="Pular">Pular</button>
      </div>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const levelLabel = document.querySelector("#levelLabel");
    const keyLabel = document.querySelector("#keyLabel");
    const livesLabel = document.querySelector("#livesLabel");
    const message = document.querySelector("#message");
    const messageEyebrow = document.querySelector("#messageEyebrow");
    const messageTitle = document.querySelector("#messageTitle");
    const messageText = document.querySelector("#messageText");
    const messageButton = document.querySelector("#messageButton");

    const floor = 470;
    const player = { x: 70, y: floor - 42, w: 30, h: 42, vx: 0, vy: 0, grounded: true };
    const levels = [
      { name: "Tudo tranquilo... por enquanto.", blocks: [], spikes: [], movers: [], patrols: [] },
      { name: "Uma caixa apareceu no caminho!", blocks: [{ x: 430, y: 410, w: 72, h: 60 }], spikes: [], movers: [], patrols: [] },
      { name: "Cuidado com os espinhos no chão.", blocks: [], spikes: [{ x: 315, w: 100 }, { x: 590, w: 100 }], movers: [], patrols: [] },
      { name: "Uma esfera está patrulhando a sala.", blocks: [{ x: 490, y: 414, w: 64, h: 56 }], spikes: [], movers: [{ x: 350, y: 398, min: 330, max: 670, speed: 150, r: 19 }], patrols: [] },
      { name: "O guardião não vai deixar você passar!", blocks: [], spikes: [{ x: 500, w: 76 }], movers: [], patrols: [{ x: 330, min: 300, max: 650, speed: 115, w: 38, h: 38 }] },
      { name: "Tudo junto. Essa é a última sala!", blocks: [{ x: 285, y: 416, w: 62, h: 54 }, { x: 630, y: 416, w: 62, h: 54 }], spikes: [{ x: 430, w: 90 }], movers: [{ x: 560, y: 376, min: 520, max: 760, speed: 190, r: 20 }], patrols: [{ x: 365, min: 350, max: 590, speed: 140, w: 38, h: 38 }] }
    ];

    const keys = new Set();
    let levelIndex = 0;
    let lives = 3;
    let hasKey = false;
    let ended = false;
    let lastTime = 0;

    function currentLevel() { return levels[levelIndex]; }

    function updateLabels() {
      levelLabel.textContent = `Sala ${levelIndex + 1} / ${levels.length}`;
      keyLabel.textContent = hasKey ? "🔑 Chave: sim" : "🔑 Chave: não";
      livesLabel.textContent = `♥ ${lives}`;
    }

    function resetPlayer() {
      player.x = 70;
      player.y = floor - player.h;
      player.vx = 0;
      player.vy = 0;
      player.grounded = true;
    }

    function showMessage(eyebrow, title, text, buttonText, action) {
      ended = true;
      messageEyebrow.textContent = eyebrow;
      messageTitle.textContent = title;
      messageText.textContent = text;
      messageButton.textContent = buttonText;
      message.hidden = false;
      messageButton.onclick = action;
    }

    function startLevel(index) {
      levelIndex = index;
      hasKey = false;
      ended = false;
      message.hidden = true;
      currentLevel().movers.forEach(item => { item.x = item.min; item.direction = 1; });
      currentLevel().patrols.forEach(item => { item.x = item.min; item.direction = 1; });
      resetPlayer();
      updateLabels();
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function movePlayer(dt) {
      const left = keys.has("ArrowLeft") || keys.has("KeyA");
      const right = keys.has("ArrowRight") || keys.has("KeyD");
      const jump = keys.has("ArrowUp") || keys.has("KeyW") || keys.has("Space");
      player.vx = (right - left) * 270;
      if (jump && player.grounded) {
        player.vy = -640;
        player.grounded = false;
      }

      const blocks = currentLevel().blocks;
      player.x += player.vx * dt;
      player.x = Math.max(12, Math.min(canvas.width - player.w - 12, player.x));
      for (const block of blocks) {
        if (rectsOverlap(player, block)) {
          if (player.vx > 0) player.x = block.x - player.w;
          if (player.vx < 0) player.x = block.x + block.w;
        }
      }

      player.vy += 1700 * dt;
      player.y += player.vy * dt;
      player.grounded = false;
      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
      }
      for (const block of blocks) {
        if (rectsOverlap(player, block)) {
          if (player.vy > 0) {
            player.y = block.y - player.h;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = block.y + block.h;
            player.vy = 0;
          }
        }
      }
    }

    function loseLife() {
      lives -= 1;
      hasKey = false;
      resetPlayer();
      updateLabels();
      if (lives <= 0) {
        showMessage("Fim de jogo", "A sala venceu desta vez!", "Recupere o fôlego e tente novamente.", "Tentar de novo", () => {
          lives = 3;
          startLevel(0);
        });
      }
    }

    function update(dt) {
      if (ended) return;
      const room = currentLevel();
      for (const item of [...room.movers, ...room.patrols]) {
        item.x += item.speed * item.direction * dt;
        if (item.x < item.min || item.x > item.max) {
          item.x = Math.max(item.min, Math.min(item.max, item.x));
          item.direction *= -1;
        }
      }

      movePlayer(dt);
      const playerBox = { x: player.x + 3, y: player.y + 3, w: player.w - 6, h: player.h - 3 };
      const hitSpike = room.spikes.some(spike => rectsOverlap(playerBox, { x: spike.x, y: floor - 22, w: spike.w, h: 22 }));
      const hitMover = room.movers.some(item => {
        const dx = player.x + player.w / 2 - item.x;
        const dy = player.y + player.h / 2 - item.y;
        return Math.hypot(dx, dy) < item.r + 13;
      });
      const hitPatrol = room.patrols.some(item => rectsOverlap(playerBox, { x: item.x, y: floor - item.h, w: item.w, h: item.h }));
      if (hitSpike || hitMover || hitPatrol) {
        loseLife();
        return;
      }

      const keyBox = { x: 775, y: floor - 55, w: 30, h: 26 };
      if (!hasKey && rectsOverlap(playerBox, keyBox)) {
        hasKey = true;
        updateLabels();
      }

      const doorBox = { x: 872, y: floor - 86, w: 56, h: 86 };
      if (hasKey && rectsOverlap(playerBox, doorBox)) {
        if (levelIndex === levels.length - 1) {
          showMessage("Todas as salas superadas", "A chave era sua!", "Você venceu todas as salas e finalmente abriu a porta.", "Jogar novamente", () => {
            lives = 3;
            startLevel(0);
          });
        } else {
          showMessage(`Sala ${levelIndex + 1} concluída`, "Porta aberta!", "Mas a próxima sala certamente esconde uma surpresa...", "Próxima sala", () => startLevel(levelIndex + 1));
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, floor);
      gradient.addColorStop(0, "#27263f");
      gradient.addColorStop(1, "#33334c");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff08";
      for (let x = 35; x < canvas.width; x += 90) {
        ctx.fillRect(x, 0, 2, floor);
      }
      ctx.fillStyle = "#d7d4ec";
      ctx.font = "700 17px Segoe UI, sans-serif";
      ctx.fillText(currentLevel().name, 34, 42);
      ctx.fillStyle = "#42425c";
      ctx.fillRect(0, floor, canvas.width, canvas.height - floor);
      ctx.fillStyle = "#74708d";
      ctx.fillRect(0, floor, canvas.width, 7);
      ctx.fillStyle = "#514e68";
      for (let x = 0; x < canvas.width; x += 48) {
        ctx.fillRect(x, floor + 22, 32, 3);
      }
    }

    function drawDoor() {
      ctx.fillStyle = "#7765d9";
      ctx.beginPath();
      ctx.roundRect(870, floor - 89, 60, 89, 10, 10);
      ctx.fill();
      ctx.fillStyle = "#29243f";
      ctx.beginPath();
      ctx.roundRect(879, floor - 78, 42, 78, 7, 7);
      ctx.fill();
      ctx.fillStyle = hasKey ? "#ffd875" : "#aaa4c8";
      ctx.beginPath();
      ctx.arc(910, floor - 40, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d5cfff";
      ctx.font = "700 12px Segoe UI, sans-serif";
      ctx.fillText("PORTA", 875, floor + 23);
    }

    function drawKey() {
      if (hasKey) return;
      const bob = Math.sin(performance.now() / 190) * 4;
      const x = 790;
      const y = floor - 43 + bob;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-.35);
      ctx.strokeStyle = "#ffd66e";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-7, -3, 9, 0, Math.PI * 2);
      ctx.moveTo(2, -3);
      ctx.lineTo(23, -3);
      ctx.lineTo(23, 4);
      ctx.moveTo(14, -3);
      ctx.lineTo(14, 3);
      ctx.stroke();
      ctx.restore();
    }

    function drawObstacles() {
      const room = currentLevel();
      for (const block of room.blocks) {
        ctx.fillStyle = "#a36a4e";
        ctx.fillRect(block.x, block.y, block.w, block.h);
        ctx.strokeStyle = "#e3a276";
        ctx.lineWidth = 3;
        ctx.strokeRect(block.x + 3, block.y + 3, block.w - 6, block.h - 6);
        ctx.beginPath();
        ctx.moveTo(block.x + 8, block.y + 8);
        ctx.lineTo(block.x + block.w - 8, block.y + block.h - 8);
        ctx.moveTo(block.x + block.w - 8, block.y + 8);
        ctx.lineTo(block.x + 8, block.y + block.h - 8);
        ctx.stroke();
      }
      for (const spike of room.spikes) {
        const count = Math.ceil(spike.w / 22);
        ctx.fillStyle = "#fa6685";
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const x = spike.x + i * (spike.w / count);
          const width = spike.w / count;
          ctx.moveTo(x, floor);
          ctx.lineTo(x + width / 2, floor - 24);
          ctx.lineTo(x + width, floor);
        }
        ctx.fill();
      }
      for (const item of room.movers) {
        ctx.shadowColor = "#ff557a";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#ff6684";
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe1e7";
        ctx.beginPath();
        ctx.arc(item.x - 6, item.y - 6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const item of room.patrols) {
        const y = floor - item.h;
        ctx.fillStyle = "#e95173";
        ctx.beginPath();
        ctx.roundRect(item.x, y, item.w, item.h, 12);
        ctx.fill();
        ctx.fillStyle = "#fff1f4";
        ctx.fillRect(item.x + 8, y + 10, 7, 8);
        ctx.fillRect(item.x + 23, y + 10, 7, 8);
        ctx.fillStyle = "#382133";
        ctx.fillRect(item.x + 10, y + 12, 3, 5);
        ctx.fillRect(item.x + 25, y + 12, 3, 5);
      }
    }

    function drawPlayer() {
      const cx = player.x + player.w / 2;
      const headY = player.y + 9;
      ctx.fillStyle = "#f3c7a6";
      ctx.beginPath();
      ctx.arc(cx, headY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#4c3b68";
      ctx.beginPath();
      ctx.arc(cx, headY - 3, 10, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#29223b";
      ctx.fillRect(cx - 4, headY - 1, 2, 3);
      ctx.fillRect(cx + 3, headY - 1, 2, 3);
      ctx.fillStyle = "#a99aff";
      ctx.beginPath();
      ctx.roundRect(player.x + 3, player.y + 20, player.w - 6, 17, 7);
      ctx.fill();
      ctx.strokeStyle = "#f3c7a6";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      const stride = player.grounded && Math.abs(player.vx) > 0 ? Math.sin(performance.now() / 65) * 4 : 0;
      ctx.beginPath();
      ctx.moveTo(cx - 5, player.y + 36);
      ctx.lineTo(cx - 7 + stride, player.y + 42);
      ctx.moveTo(cx + 5, player.y + 36);
      ctx.lineTo(cx + 7 - stride, player.y + 42);
      ctx.stroke();
    }

    function draw() {
      drawBackground();
      drawDoor();
      drawObstacles();
      drawKey();
      drawPlayer();
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 1 / 30);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    const keyAliases = { " ": "Space", Spacebar: "Space" };
    window.addEventListener("keydown", event => {
      const code = keyAliases[event.key] || event.code;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(code)) event.preventDefault();
      keys.add(code);
    });
    window.addEventListener("keyup", event => keys.delete(keyAliases[event.key] || event.code));
    window.addEventListener("blur", () => keys.clear());
    document.querySelectorAll("[data-key]").forEach(button => {
      const code = button.dataset.key;
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys.add(code);
        button.setPointerCapture(event.pointerId);
      });
      const release = () => keys.delete(code);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    updateLabels();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
