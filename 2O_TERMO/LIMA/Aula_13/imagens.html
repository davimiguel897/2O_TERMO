<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Videos</title>
</head>
<body>
    <h1>Trabalhando com Imagens</h1>
    <h2>Imagem responsiva básica</h2>
        <figure class="resp-bas">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRUSV4niM-KJABsqU74g6hZV1A7mlYxvXGufnOqKxGKJQ&s=10" alt="Seek">
        </figure>

    <h2>Imagem com Recorte</h2>
        <figure class="img-rec">
            <img src="https://static.wikia.nocookie.net/doors-game/images/3/36/Rushvnew.webp/revision/latest?cb=20250910030411" alt="Rush">
        </figure>

    <h2>Imagem em formato de cards</h2>
        <figure class="img-card">
            <img src="https://static.wikia.nocookie.net/doors-game/images/c/cf/FigureRender.webp/revision/latest?cb=20261022172033" alt="The Figure">
        </figure>
    
    <h2>Personalização</h2>
        <figure class="pers-img">
            <img src="https://static.wikia.nocookie.net/doors-game/images/a/a7/Screech2.png/revision/latest?cb=20230213122548" alt="Screech">
        </figure>

    <h2>Imagens em Grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
            <img src="https://static.wikia.nocookie.net/doors-game/images/b/bf/NewJeff.png/revision/latest/scale-to-width-down/1200?cb=20250321025523" alt="Jeff">
        </article>
        <article class="img-grid">
            <img src="https://static.wikia.nocookie.net/doors-game/images/5/56/Goblinov3.png/revision/latest?cb=20250330003606" alt="El Goblino">
        </article>
        <article class="img-grid">
            <img src="https://static.wikia.nocookie.net/doors-game/images/8/84/NewBob.png/revision/latest?cb=20250322190705" alt="Bob">
        </article>
    </section>

    <section class="video">
        <h2>Monster de Café</h2>
        <iframe class="video-bd" width="560" height="315" src="https://www.youtube.com/embed/nI4r0eOxLmU?si=-s1irsHoLC5r3dPo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
</body>
</html>
