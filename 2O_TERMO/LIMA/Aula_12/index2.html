<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Root</title>
</head>
<body>
    <header>
        <section class="cabecalho">
            <a href="#visual" class="visual">Marca visual</a>

            <nav>
                <ul class="menu">
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#cardapio">Cardapio</a></li>
                </ul>
            </nav>
        </section>

    </header>
    
    <section class="banner">
        <h1>Sua marca é nosso lema</h1>
        <figure class="banner-imagem">
            <img src="https://neilpatel.com/wp-content/uploads/2018/01/elementos-de-design-e-identidade-visual-de-marca.jpeg" alt="Marca da nossa empresa">
            <figcaption>Fundada em 1900</figcaption>
        </figure>
        <a href="#marca-reg" class="marca-reg">Ver Marcas</a>
    </section>

    <section class="sobre">
        <h2>Nossas Marcas</h2>
        <figure class="sobre-imagem">
            <img src="" alt="Sobre as nossas marcas">
        </figure>
        <ul class="lista-marca">
            <li>
                <article class="img-cartao">
                <figure>
                    <img src="" alt="Imagem 1">
                </figure>
                </article>
            </li>

            <li>
                <article class="img-cartao">
                <figure>
                    <img src="" alt="Imagem 2">
                </figure>
                </article>
            </li>

            <li>
                <article class="img-cartao">
                <figure>
                    <img src="" alt="Imagem 3">
                </figure>
                </article>
            </li>
        </ul>

    </section>
</body>
</html>
